name: MySQL Warehouse Validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: mysql-warehouse-validation
  cancel-in-progress: true

permissions:
  contents: read

env:
  MYSQL_HOST: 127.0.0.1
  MYSQL_PORT: 3306
  MYSQL_USER: root
  MYSQL_PWD: root

jobs:
  validate:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install MySQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y mysql-client

      - name: Enable LOCAL INFILE on MySQL server
        run: |
          mysql             -h "$MYSQL_HOST"             -P "$MYSQL_PORT"             -u "$MYSQL_USER"             -e "SET GLOBAL local_infile = 1;"

      - name: Initialize layer databases
        run: |
          mysql             -h "$MYSQL_HOST"             -P "$MYSQL_PORT"             -u "$MYSQL_USER"             --local-infile=1             < scripts/init_database.sql

      - name: Create Bronze tables
        run: |
          mysql             -h "$MYSQL_HOST"             -P "$MYSQL_PORT"             -u "$MYSQL_USER"             --local-infile=1             < scripts/bronze/ddl_bronze.sql

      - name: Load Bronze data
        run: |
          mysql             -h "$MYSQL_HOST"             -P "$MYSQL_PORT"             -u "$MYSQL_USER"             --local-infile=1             < scripts/bronze/load_bronze.sql

      - name: Build Silver
        run: |
          mysql             -h "$MYSQL_HOST"             -P "$MYSQL_PORT"             -u "$MYSQL_USER"             --local-infile=1             < scripts/silver/ddl_silver.sql

          mysql             -h "$MYSQL_HOST"             -P "$MYSQL_PORT"             -u "$MYSQL_USER"             --local-infile=1             < scripts/silver/proc_load_silver.sql

          mysql             -h "$MYSQL_HOST"             -P "$MYSQL_PORT"             -u "$MYSQL_USER"             -e "CALL silver.load_silver();"

      - name: Build Gold
        run: |
          mysql             -h "$MYSQL_HOST"             -P "$MYSQL_PORT"             -u "$MYSQL_USER"             < scripts/gold/ddl_gold.sql

      - name: Run CI data-quality validation
        run: |
          mysql             -h "$MYSQL_HOST"             -P "$MYSQL_PORT"             -u "$MYSQL_USER"             < tests/ci_validation.sql
